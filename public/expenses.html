<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Все расходы</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .filter-btns button { margin: 5px; }
    .card { margin: 8px 0; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    .delete-btn { color: red; cursor: pointer; margin-left: 10px; }
    footer {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #555;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>💰 Все расходы</h2>
    <button onclick="window.location.href='home.html'">⬅ Назад</button>

    <!-- Фильтры -->
    <div class="filter-btns">
      <button onclick="loadData('all')">Все</button>
      <button onclick="loadData('day')">Сегодня</button>
      <button onclick="loadData('week')">Неделя</button>
      <button onclick="loadData('month')">Месяц</button>
    </div>

    <!-- Итоговая сумма -->
    <h3 id="total">Общая сумма: 0 so'm</h3>

    <div id="list"></div>
  </div>

  <!-- 🔹 Футер -->
  <footer>
    💼 Добро пожаловать в Ваш личный финансовый кабинет
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgN19pCiK1hZeG2ClDMbaNgnL23Z3JrqY",
      authDomain: "finance-app-8025c.firebaseapp.com",
      projectId: "finance-app-8025c",
      storageBucket: "finance-app-8025c.firebasestorage.app",
      messagingSenderId: "801849005781",
      appId: "1:801849005781:web:badf68b51e221508cef45c",
      measurementId: "G-V2T1F9NB3R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const type = "expenses"; // эта страница для расходов

    let currentUser = null;
    let allData = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;
      await fetchData();
      loadData("all");
    });

    async function fetchData() {
      const q = query(collection(db, "users", currentUser.uid, type), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);
      allData = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));
    }

    window.loadData = function(filter) {
      const now = new Date();
      let filtered = allData;

      if (filter === "day") {
        filtered = allData.filter(d => {
          const date = d.createdAt.toDate();
          return date.toDateString() === now.toDateString();
        });
      } else if (filter === "week") {
        const weekAgo = new Date();
        weekAgo.setDate(now.getDate() - 7);
        filtered = allData.filter(d => d.createdAt.toDate() >= weekAgo);
      } else if (filter === "month") {
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        filtered = allData.filter(d => d.createdAt.toDate() >= monthStart);
      }

      renderList(filtered);
    }

    function renderList(data) {
      const list = document.getElementById("list");
      const total = data.reduce((sum, d) => sum + d.amount, 0);

      document.getElementById("total").innerText = `Общая сумма: ${total} so'm`;

      list.innerHTML = data.map(d => {
        const date = d.createdAt.toDate().toLocaleString("ru-RU");
        return `
          <div class="card">
            <b>${d.amount} so'm</b> — ${d.desc} <br>
            <small>📅 ${date}</small>
            <span class="delete-btn" onclick="deleteEntry('${d.id}')">✖ Удалить</span>
          </div>
        `;
      }).join("");
    }

    window.deleteEntry = async function(id) {
      await deleteDoc(doc(db, "users", currentUser.uid, type, id));
      await fetchData();
      loadData("all");
    }
  </script>
</body>
</html>
