<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Финансовый секретарь</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .summary .card { margin: 0; }
    .summary small { color: #888; display: block; }
    .summary b { font-size: 16px; }
    .summary .wide { grid-column: span 2; text-align: center; }
    .positive { color: #2e7d32; }
    .negative { color: #c62828; }
    .note {
      background: white;
      border-left: 4px solid #4CAF50;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 8px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .note.warn { border-left-color: #ff9800; }
    .note.alert { border-left-color: #e53935; }
    .hint { font-size: 13px; color: #777; }
    #reply { font-weight: bold; min-height: 20px; }
    footer {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #555;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>🧑‍💼 Финансовый секретарь</h2>
    <button onclick="window.location.href='home.html'">⬅ Назад</button>

    <!-- Быстрая команда -->
    <h3>✍️ Быстрая запись</h3>
    <input id="command" type="text" placeholder="Например: расход 25000 обед">
    <button id="sendBtn">Записать</button>
    <p class="hint">
      Команды: <b>расход</b>, <b>доход</b>, <b>долг</b>, <b>накопил</b> + сумма + описание.<br>
      Примеры: «доход 3000000 зарплата», «долг 200000 Али», «накопил 500000 на машину».
    </p>
    <p id="reply"></p>

    <!-- Сводка за месяц -->
    <h3 id="monthTitle">📊 Этот месяц</h3>
    <div class="summary" id="summary"></div>

    <!-- Отчёт секретаря -->
    <h3>📝 Отчёт секретаря</h3>
    <div id="notes"><p class="hint">Загружаю данные...</p></div>
  </div>

  <!-- 🔹 Футер -->
  <footer>
    🌟 Сайт создан с заботой: Раджапов Бегдияр
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgN19pCiK1hZeG2ClDMbaNgnL23Z3JrqY",
      authDomain: "finance-app-8025c.firebaseapp.com",
      projectId: "finance-app-8025c",
      storageBucket: "finance-app-8025c.firebasestorage.app",
      messagingSenderId: "801849005781",
      appId: "1:801849005781:web:badf68b51e221508cef45c",
      measurementId: "G-V2T1F9NB3R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const TYPES = ["income", "expenses", "debts", "savings"];

    // Слова команд → коллекция
    const COMMANDS = {
      "расход": "expenses", "потратил": "expenses", "трата": "expenses",
      "доход": "income", "получил": "income", "зарплата": "income", "поступление": "income",
      "долг": "debts", "занял": "debts",
      "накопил": "savings", "отложил": "savings", "накопление": "savings"
    };

    const LABELS = {
      income: "📈 Поступление",
      expenses: "💰 Расход",
      debts: "🤝 Долг",
      savings: "🏦 Накопление"
    };

    let currentUser = null;
    let data = { income: [], expenses: [], debts: [], savings: [] };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      currentUser = user;
      await fetchAll();
      render();
    });

    async function fetchAll() {
      for (const type of TYPES) {
        const snapshot = await getDocs(collection(db, "users", currentUser.uid, type));
        data[type] = snapshot.docs.map(docSnap => {
          const d = docSnap.data();
          return {
            amount: Number(d.amount) || 0,
            desc: d.desc || "",
            date: d.createdAt?.toDate ? d.createdAt.toDate() : new Date(0)
          };
        });
      }
    }

    // ---------- Быстрая запись ----------

    function parseCommand(text) {
      const words = text.trim().split(/\s+/);
      if (words.length < 2) return null;

      const type = COMMANDS[words[0].toLowerCase()];
      if (!type) return null;

      // Сумма: допускаем «25000», «25 000», «25k», «1.5м»
      const rest = words.slice(1);
      let amount = parseAmount(rest[0]);
      let i = 1;
      // «25 000» — группы по три цифры после первого числа
      while (amount && /^\d+$/.test(rest[0]) && i < rest.length && /^\d{3}$/.test(rest[i])) {
        amount = amount * 1000 + Number(rest[i]);
        i++;
      }
      if (!amount || amount <= 0) return null;

      const desc = rest.slice(i).join(" ") || LABELS[type].slice(3);
      return { type, amount: Math.round(amount), desc };
    }

    function parseAmount(token) {
      const m = token.toLowerCase().match(/^([\d.,]+)([kкmм]?)$/);
      if (!m) return 0;
      let n = Number(m[1].replace(",", "."));
      if (m[2] === "k" || m[2] === "к") n *= 1000;
      if (m[2] === "m" || m[2] === "м") n *= 1000000;
      return n;
    }

    async function sendCommand() {
      const input = document.getElementById("command");
      const reply = document.getElementById("reply");
      const parsed = parseCommand(input.value);

      if (!parsed) {
        reply.style.color = "#c62828";
        reply.textContent = "🤔 Не понял. Напишите, например: «расход 25000 обед».";
        return;
      }

      await addDoc(collection(db, "users", currentUser.uid, parsed.type), {
        amount: parsed.amount,
        desc: parsed.desc,
        createdAt: new Date()
      });

      data[parsed.type].push({ amount: parsed.amount, desc: parsed.desc, date: new Date() });
      input.value = "";
      reply.style.color = "#2e7d32";
      reply.textContent = `✅ Записал: ${LABELS[parsed.type]} — ${money(parsed.amount)} (${parsed.desc})`;
      render();
    }

    document.getElementById("sendBtn").addEventListener("click", sendCommand);
    document.getElementById("command").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendCommand();
    });

    // ---------- Сводка и отчёт ----------

    function money(n) {
      return `${Math.round(n).toLocaleString("ru-RU")} so'm`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function sum(list) {
      return list.reduce((s, d) => s + d.amount, 0);
    }

    function inRange(list, from, to) {
      return list.filter(d => d.date >= from && d.date < to);
    }

    function render() {
      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const prevMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1);

      const month = {};
      const prev = {};
      for (const type of TYPES) {
        month[type] = inRange(data[type], monthStart, nextMonth);
        prev[type] = inRange(data[type], prevMonthStart, monthStart);
      }

      const income = sum(month.income);
      const expenses = sum(month.expenses);
      const saved = sum(month.savings);
      const balance = income - expenses - saved;
      const totalDebts = sum(data.debts);
      const totalSavings = sum(data.savings);

      const monthName = now.toLocaleString("ru-RU", { month: "long", year: "numeric" });
      document.getElementById("monthTitle").textContent = `📊 ${monthName}`;

      document.getElementById("summary").innerHTML = `
        <div class="card"><small>Поступления</small><b class="positive">+${money(income)}</b></div>
        <div class="card"><small>Расходы</small><b class="negative">-${money(expenses)}</b></div>
        <div class="card"><small>Отложено</small><b>${money(saved)}</b></div>
        <div class="card"><small>Долги (всего)</small><b class="negative">${money(totalDebts)}</b></div>
        <div class="card wide"><small>Свободный остаток за месяц</small>
          <b class="${balance >= 0 ? "positive" : "negative"}">${balance >= 0 ? "+" : ""}${money(balance)}</b>
        </div>
        <div class="card wide"><small>Всего накоплено</small><b>💎 ${money(totalSavings)}</b></div>
      `;

      const notes = buildNotes({ now, month, prev, income, expenses, saved, balance, totalDebts, totalSavings });
      document.getElementById("notes").innerHTML = notes
        .map(n => `<div class="note ${n.level || ""}">${n.text}</div>`)
        .join("");
    }

    function buildNotes({ now, month, prev, income, expenses, saved, balance, totalDebts, totalSavings }) {
      const notes = [];
      const hasAny = TYPES.some(t => data[t].length > 0);

      if (!hasAny) {
        notes.push({ text: "👋 Здравствуйте! Пока записей нет. Начните с быстрой записи выше — например, «доход 3000000 зарплата»." });
        return notes;
      }

      // Остаток
      if (balance < 0) {
        notes.push({ level: "alert", text: `⚠️ В этом месяце расходы превышают поступления на <b>${money(-balance)}</b>. Стоит притормозить с тратами.` });
      } else if (income > 0) {
        notes.push({ text: `👍 В этом месяце у вас остаётся <b>${money(balance)}</b> свободных денег.` });
      }

      // Норма сбережений
      if (income > 0) {
        const rate = Math.round((saved / income) * 100);
        if (rate >= 20) {
          notes.push({ text: `🏆 Вы откладываете <b>${rate}%</b> дохода — отличный результат!` });
        } else {
          const target = Math.round(income * 0.2);
          notes.push({ level: "warn", text: `💡 Вы откладываете ${rate}% дохода. Рекомендуется хотя бы 20% — это <b>${money(target)}</b> в месяц.` });
        }
      }

      // Прогноз расходов до конца месяца
      const day = now.getDate();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      if (expenses > 0) {
        const perDay = expenses / day;
        const forecast = perDay * daysInMonth;
        let text = `📅 В среднем вы тратите <b>${money(perDay)}</b> в день. Прогноз расходов на месяц: <b>${money(forecast)}</b>.`;
        let level = "";
        if (income > 0 && forecast > income) {
          text += " Это больше, чем ваши поступления.";
          level = "warn";
        }
        notes.push({ level, text });

        if (income > 0 && balance > 0 && day < daysInMonth) {
          const left = daysInMonth - day;
          notes.push({ text: `🧮 Чтобы не уйти в минус, можно тратить до <b>${money(balance / left)}</b> в день оставшиеся ${left} дн.` });
        }
      }

      // Сравнение с прошлым месяцем
      const prevExpenses = sum(prev.expenses);
      if (prevExpenses > 0 && expenses > 0) {
        const diff = Math.round(((expenses - prevExpenses) / prevExpenses) * 100);
        if (diff > 0) {
          notes.push({ level: diff > 20 ? "warn" : "", text: `📈 Расходы выросли на <b>${diff}%</b> по сравнению с прошлым месяцем (${money(prevExpenses)}).` });
        } else if (diff < 0) {
          notes.push({ text: `📉 Расходы снизились на <b>${-diff}%</b> по сравнению с прошлым месяцем. Так держать!` });
        }
      }

      // Крупнейшие статьи расходов
      if (month.expenses.length > 0) {
        const groups = {};
        for (const d of month.expenses) {
          const key = d.desc.trim().toLowerCase() || "без описания";
          groups[key] = (groups[key] || 0) + d.amount;
        }
        const top = Object.entries(groups).sort((a, b) => b[1] - a[1]).slice(0, 3);
        const list = top
          .map(([name, amount]) => `${escapeHtml(name)} — ${money(amount)} (${Math.round((amount / expenses) * 100)}%)`)
          .join("<br>");
        notes.push({ text: `🔍 Больше всего денег ушло на:<br>${list}` });
      }

      // Долги
      if (totalDebts > 0) {
        const oldest = [...data.debts].sort((a, b) => a.date - b.date)[0];
        const daysAgo = Math.floor((now - oldest.date) / 86400000);
        let text = `🤝 Общая сумма долгов: <b>${money(totalDebts)}</b> (${data.debts.length} зап.).`;
        if (daysAgo >= 30) {
          text += ` Самому старому долгу («${escapeHtml(oldest.desc)}») уже ${daysAgo} дн. — пора разобраться с ним.`;
        }
        if (totalSavings >= totalDebts) {
          text += " Ваших накоплений хватает, чтобы закрыть все долги.";
        }
        notes.push({ level: daysAgo >= 30 ? "warn" : "", text });
      }

      // Подушка безопасности
      if (prevExpenses > 0 || expenses > 0) {
        const monthly = Math.max(prevExpenses, expenses);
        const months = totalSavings / monthly;
        if (months < 3) {
          notes.push({ level: "warn", text: `🛟 Накоплений хватит примерно на <b>${months.toFixed(1)}</b> мес. расходов. Хорошая «подушка безопасности» — от 3 до 6 месяцев (${money(monthly * 3)}).` });
        } else {
          notes.push({ text: `🛟 Накоплений хватит примерно на <b>${months.toFixed(1)}</b> мес. расходов — подушка безопасности есть.` });
        }
      }

      return notes;
    }
  </script>
</body>
</html>
