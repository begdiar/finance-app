<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Все долги</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .total {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
      padding: 8px;
      background: #f8f8f8;
      border-radius: 6px;
    }
    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
    }
    .card small {
      color: #888;
      font-size: 12px;
      display: block;
    }
    .delete-btn {
      background: red;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    footer {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      background: #f0f0f0;
      border-top: 1px solid #ccc;
      font-size: 14px;
      color: #555;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h2>🤝 Все долги</h2>
    <button onclick="window.location.href='home.html'">⬅ Назад</button>
    <div id="total" class="total"></div>
    <div id="list"></div>
  </div>

  <footer>
    💼 Добро пожаловать в Ваш личный финансовый кабинет
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgN19pCiK1hZeG2ClDMbaNgnL23Z3JrqY",
      authDomain: "finance-app-8025c.firebaseapp.com",
      projectId: "finance-app-8025c",
      storageBucket: "finance-app-8025c.firebasestorage.app",
      messagingSenderId: "801849005781",
      appId: "1:801849005781:web:badf68b51e221508cef45c",
      measurementId: "G-V2T1F9NB3R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const type = "debts"; // 🔹 эта страница для долгов

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const q = query(collection(db, "users", user.uid, type), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);

      let total = 0;
      const list = document.getElementById("list");

      list.innerHTML = snapshot.docs.map(docSnap => {
        const d = docSnap.data();
        total += Number(d.amount);

        const date = d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString() : "";

        return `
          <div class="card">
            <div>
              <b>-${d.amount} so'm</b> — ${d.desc}
              <small>📅 ${date}</small>
            </div>
            <button class="delete-btn" onclick="deleteItem('${docSnap.id}')">Удалить</button>
          </div>
        `;
      }).join("");

      document.getElementById("total").textContent = `📊 Общая сумма долгов: -${total} so'm`;

      // Удаление документа
      window.deleteItem = async (id) => {
        await deleteDoc(doc(db, "users", user.uid, type, id));
        location.reload();
      };
    });
  </script>
</body>
</html>
